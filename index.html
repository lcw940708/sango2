<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>三國群英傳 2 網頁版 (Win95)</title>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <style>
        html, body, #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
        Dos(document.getElementById("app"), {
            url: "https://v8.js-dos.com/bundles/win95.jsdos",
            // 指定使用 Win95 系統鏡像來運行 Windows 程式
            autoStart: true,
            windows: "win95",
        });
    </script>
</body>
</html>
