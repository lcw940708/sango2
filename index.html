<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>三國群英傳 2 網頁版</title>
    <!-- 1. 引入 js-dos v7 樣式 -->
    <link rel="stylesheet" href="https://js-dos.com/v7/build/dos.css">
</head>
<body>
    <div id="app" style="width: 100vw; height: 100vh;"></div>

    <!-- 2. 必須先引入 js-dos 核心腳本（這行最關鍵，漏左就會報 Dos is not defined） -->
    <script src="https://js-dos.com/v7/build/dos.js"></script>

    <!-- 3. 初始化模擬器並載入你的 GitHub Release 檔案 -->
    <script>
        Dos(document.getElementById("app"), {
            url: "https://github.com/lcw940708/sango2/releases/download/v1.0.0/sango2.zip",
        });
    </script>
</body>
</html>
