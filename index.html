<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>三國群英傳 2 網頁版</title>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <style>
        html, body, #app {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
        Dos(document.getElementById("app"), {
            url: "https://v8.js-dos.com/bundles/doom.jsdos",
            // 透過 command 命令手動話俾 DOS 知：入到去要行邊個指令
            command: "_inmmserv.exe",
        });
    </script>
</body>
</html>
